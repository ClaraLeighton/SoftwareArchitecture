# ---------------------------------------------------------------------------
# Deployment 2: Application + Database + Reverse Proxy (single instance).
#
#   docker compose -f docker-compose.proxy.yml up --build
#
# The Nginx edge terminates TLS (self-signed cert for app.localhost) and
# serves/caches the static assets and uploads from the shared volume. The
# application behind it only renders dynamic HTML.
#
# Access: https://app.localhost  (add `127.0.0.1 app.localhost` to /etc/hosts)
# ---------------------------------------------------------------------------
name: book_reviews_proxy

services:
  # ---------------------------------------------------------------------------
  # Database: MongoDB 7 (same as deployment 1).
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: book_reviews_mongodb_proxy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-seed/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
      - ./mongo-seed:/seed:ro
    environment:
      MONGO_INITDB_DATABASE: book_reviews
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Application (single instance). No host ports: the edge is the entry point.
  # Writes its uploads to the shared volume and publishes its compiled assets
  # there, so the proxy can serve them directly.
  # ---------------------------------------------------------------------------
  app:
    build: .
    image: book_reviews/app:4.0.0
    container_name: book_reviews_app_proxy
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - shared_data:/data
    environment:
      PORT: "4000"
      PHX_SERVER: "true"
      PHX_HOST: "app.localhost"
      FORCE_SSL: "false"
      MONGODB_URL: mongodb://mongodb:27017/book_reviews
      # The reverse proxy is present: it serves and caches the static assets.
      SERVE_STATIC_ASSETS: "false"
      # Shared storage for uploads and for the published static assets.
      UPLOADS_PATH: /data/uploads
      STATIC_DIR: /data/static
      SECRET_KEY_BASE: bDHAZXCeUwX7zYXRfUnXXlJ3fgAbv3YzGvR/vFpNP2dlZ7WCq6o+sWgiobcqLEsJ

  # ---------------------------------------------------------------------------
  # Reverse proxy (Nginx): TLS termination + static assets + reverse proxy.
  # ---------------------------------------------------------------------------
  nginx:
    build: ./nginx
    image: book_reviews/nginx:4.0.0
    container_name: book_reviews_nginx_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_UPSTREAM: "server app:4000;"
    volumes:
      - shared_data:/data

volumes:
  mongodb_data:
  shared_data: