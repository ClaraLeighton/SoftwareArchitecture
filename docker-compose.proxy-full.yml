# ---------------------------------------------------------------------------
# Deployment 3: Application + Database + Reverse Proxy + Cache + Search Engine
# (single instance). Carries over the cache (Redis) and the search engine
# (OpenSearch) from Assignment 3, now behind the Nginx edge.
#
#   docker compose -f docker-compose.proxy-full.yml up --build
#
# Access: https://app.localhost
# ---------------------------------------------------------------------------
name: book_reviews_proxy_full

services:
  # ---------------------------------------------------------------------------
  # Database: MongoDB 7.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: book_reviews_mongodb_full
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-seed/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
      - ./mongo-seed:/seed:ro
    environment:
      MONGO_INITDB_DATABASE: book_reviews
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Cache: Redis (optional read-acceleration tier).
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: book_reviews_cache_full
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Search engine: OpenSearch (single node, security disabled for local use).
  # ---------------------------------------------------------------------------
  search:
    image: opensearchproject/opensearch:2
    container_name: book_reviews_search_full
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Application (single instance) with cache + search enabled.
  # ---------------------------------------------------------------------------
  app:
    build: .
    image: book_reviews/app:4.0.0
    container_name: book_reviews_app_full
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      cache:
        condition: service_healthy
      search:
        condition: service_healthy
    volumes:
      - shared_data:/data
    environment:
      PORT: "4000"
      PHX_SERVER: "true"
      PHX_HOST: "app.localhost"
      FORCE_SSL: "false"
      MONGODB_URL: mongodb://mongodb:27017/book_reviews
      REDIS_URL: redis://cache:6379
      CACHE_ENABLED: "true"
      OPENSEARCH_URL: http://search:9200
      SEARCH_ENABLED: "true"
      SERVE_STATIC_ASSETS: "false"
      UPLOADS_PATH: /data/uploads
      STATIC_DIR: /data/static
      SECRET_KEY_BASE: bDHAZXCeUwX7zYXRfUnXXlJ3fgAbv3YzGvR/vFpNP2dlZ7WCq6o+sWgiobcqLEsJ

  # ---------------------------------------------------------------------------
  # Reverse proxy (Nginx): TLS termination + static assets + reverse proxy.
  # ---------------------------------------------------------------------------
  nginx:
    build: ./nginx
    image: book_reviews/nginx:4.0.0
    container_name: book_reviews_nginx_full
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_UPSTREAM: "server app:4000;"
    volumes:
      - shared_data:/data

volumes:
  mongodb_data:
  shared_data: