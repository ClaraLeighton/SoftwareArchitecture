# ---------------------------------------------------------------------------
# Deployment 1: Application + Database (single instance, no reverse proxy).
#
#   docker compose -f docker-compose.yml up --build
#
# The application serves its own static assets and uploads. Uploaded images
# default to the instance's priv/static/uploads; there is no edge in front.
# ---------------------------------------------------------------------------
name: book_reviews_app_db

services:
  # ---------------------------------------------------------------------------
  # Database: MongoDB 7 in its own container.
  # Data persists in the named volume; seed.js runs automatically on first
  # start (empty volume) via /docker-entrypoint-initdb.d.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: book_reviews_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-seed/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
      - ./mongo-seed:/seed:ro
    environment:
      MONGO_INITDB_DATABASE: book_reviews
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Application: Phoenix web app built from the local Dockerfile.
  # Waits for MongoDB to be healthy before starting.
  # ---------------------------------------------------------------------------
  app:
    build: .
    image: book_reviews/app:4.0.0
    container_name: book_reviews_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      PHX_SERVER: "true"
      PHX_HOST: "localhost"
      FORCE_SSL: "false"
      MONGODB_URL: mongodb://mongodb:27017/book_reviews
      # No proxy in front: the application serves/caches nothing at the edge,
      # so it keeps serving its own static assets and uploads.
      SERVE_STATIC_ASSETS: "true"
      # Dev-only secret for this assignment; generate your own with
      # `mix phx.gen.secret` before exposing the app publicly.
      SECRET_KEY_BASE: bDHAZXCeUwX7zYXRfUnXXlJ3fgAbv3YzGvR/vFpNP2dlZ7WCq6o+sWgiobcqLEsJ

volumes:
  mongodb_data: