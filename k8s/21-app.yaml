# ---------------------------------------------------------------------------
# Phoenix application
# - Deployment: runs the release built by the repo Dockerfile, scaled to 3
#   replicas. The Service (below) is the load balancer Kubernetes provides:
#   it distributes requests across all replicas.
# - Service: ClusterIP (the Nginx edge at k8s/30-edge.yaml is the entry point)
# Configuration comes from the app-config ConfigMap and app-secret Secret,
# nothing is hard-coded in the image.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-app
  namespace: book-reviews
  labels:
    app: book-reviews
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: book-reviews
      component: web
  template:
    metadata:
      labels:
        app: book-reviews
        component: web
    spec:
      # Wait until the database accepts connections before starting the app.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: app
          image: book-reviews/app:4.0.0
          imagePullPolicy: IfNotPresent   # local cluster uses an imported image
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          # Shared storage: uploads and published static assets live on the
          # uploads PVC, mounted identically in every replica + the edge.
          volumeMounts:
            - name: uploads
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: Service
metadata:
  name: book-reviews
  namespace: book-reviews
  labels:
    app: book-reviews
    component: web
spec:
  type: ClusterIP
  selector:
    app: book-reviews
    component: web
  ports:
    - port: 80
      targetPort: 4000
