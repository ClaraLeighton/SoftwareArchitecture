# ---------------------------------------------------------------------------
# Phoenix application
# - Deployment: runs the release built by the repo Dockerfile
# - Service: NodePort for local clusters; switch to LoadBalancer on EKS/GKE/AKS
# Configuration comes from the app-config ConfigMap and app-secret Secret,
# nothing is hard-coded in the image.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-app
  namespace: book-reviews
  labels:
    app: book-reviews
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-reviews
      component: web
  template:
    metadata:
      labels:
        app: book-reviews
        component: web
    spec:
      # Wait until the database accepts connections before starting the app.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: app
          image: book-reviews/app:1.0.0
          imagePullPolicy: IfNotPresent   # local cluster uses an imported image
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: book-reviews
  namespace: book-reviews
  labels:
    app: book-reviews
    component: web
spec:
  # NodePort works out of the box with k3d/minikube port mappings.
  # For managed clouds use type: LoadBalancer instead (see README.md).
  type: NodePort
  selector:
    app: book-reviews
    component: web
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30000
