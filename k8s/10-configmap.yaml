apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: book-reviews
data:
  PORT: "4000"
  PHX_HOST: "app.localhost"
  # Points at the in-cluster MongoDB Service (mongodb.book-reviews.svc).
  MONGODB_URL: "mongodb://mongodb.book-reviews.svc.cluster.local:27017/book_reviews"
  # Disable force_ssl in local clusters where TLS is not terminated at the app.
  FORCE_SSL: "false"
  # Optional read-acceleration tier: cache (Redis) + search engine (OpenSearch).
  # The application degrades gracefully when either endpoint is unavailable.
  REDIS_URL: "redis://cache.book-reviews.svc.cluster.local:6379"
  CACHE_ENABLED: "true"
  OPENSEARCH_URL: "http://search.book-reviews.svc.cluster.local:9200"
  SEARCH_ENABLED: "true"
  # Edge: the Nginx reverse proxy (k8s/30-edge.yaml) serves and caches the
  # static assets, so the app publishes them + its uploads to the shared PVC.
  SERVE_STATIC_ASSETS: "false"
  UPLOADS_PATH: "/data/uploads"
  STATIC_DIR: "/data/static"
